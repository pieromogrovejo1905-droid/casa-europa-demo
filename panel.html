<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de la promo · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body { background: #F7F3EC; }
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 38px); }
  aside { background: #fff; border-right: 1px solid var(--linea); padding: 20px 12px; }
  aside .marca { font-family: var(--titulo); font-weight: 800; font-size: 18px; padding: 0 10px 18px; display: flex; gap: 8px; align-items: center; }
  aside .marca i { width: 30px; height: 30px; border-radius: 50%; background: var(--rojo); color: var(--amarillo); display: grid; place-items: center; font-style: normal; font-size: 15px; }
  aside button { display: flex; width: 100%; align-items: center; gap: 10px; border: 0; background: none; padding: 10px 12px; border-radius: 10px; text-align: left; color: var(--tinta); font-weight: 500; }
  aside button:hover { background: var(--crema); }
  aside button.on { background: var(--rojo); color: #fff; }
  aside button .n { margin-left: auto; font-size: 12px; background: var(--amarillo); color: var(--tinta); border-radius: 999px; padding: 1px 8px; font-weight: 700; }
  aside .rol { margin-top: 26px; padding: 12px 10px; border-top: 1px solid var(--linea); font-size: 12px; color: var(--gris); }
  aside select { width: 100%; margin-top: 6px; padding: 8px; border-radius: 8px; border: 1px solid var(--linea); background: #fff; }
  main { padding: 24px 28px 60px; min-width: 0; }
  .cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .cab h1 { font-size: 30px; margin: 0; }
  .cab p { margin: 4px 0 0; color: var(--gris); font-size: 14px; }
  .seg { display: inline-flex; background: #fff; border: 1px solid var(--linea); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; font-size: 13px; }
  .seg button.on { background: var(--tinta); color: #fff; }
  @media (max-width: 860px) { .app { grid-template-columns: 1fr; } aside { display: flex; overflow-x: auto; gap: 4px; padding: 8px; border-right: 0; border-bottom: 1px solid var(--linea); } aside .marca, aside .rol { display: none; } aside button { white-space: nowrap; width: auto; } main { padding: 18px 16px 50px; } }

  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi { background: #fff; border-radius: var(--radio); padding: 16px; box-shadow: 0 1px 0 var(--linea); }
  .kpi span { font-size: 12.5px; color: var(--gris); display: block; }
  .kpi b { font-family: var(--titulo); font-weight: 400; letter-spacing: .03em; font-size: 34px; line-height: 1.15; display: block; }
  .kpi small { font-size: 12px; color: var(--gris); }
  .kpi.verde b { color: var(--verde); } .kpi.rojo b { color: var(--rojo); } .kpi.morado b { color: var(--morado); } .kpi.naranja b { color: var(--naranja); }
  .grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; margin-bottom: 14px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 1100px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
  .card { background: #fff; border-radius: var(--radio); padding: 18px 20px; box-shadow: 0 1px 0 var(--linea); min-width: 0; }
  .card h3 { font-family: var(--texto); font-size: 15px; font-weight: 700; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .card h3 small { font-weight: 400; color: var(--gris); font-size: 12px; }
  .leyenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--gris); margin-bottom: 6px; }
  .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .hbar { display: grid; grid-template-columns: minmax(110px, 38%) 1fr 54px; gap: 10px; align-items: center; font-size: 13px; padding: 5px 0; }
  .hbar .t { height: 12px; border-radius: 6px; background: var(--crema-2); overflow: hidden; }
  .hbar .t i { display: block; height: 100%; border-radius: 6px; background: var(--rojo); }
  .hbar b { text-align: right; font-variant-numeric: tabular-nums; }
  .embudo .hbar .t i { background: var(--tinta); }
  svg text { font-family: var(--texto); }
  .tip { position: fixed; pointer-events: none; background: var(--tinta); color: #fff; font-size: 12px; padding: 6px 9px; border-radius: 6px; z-index: 90; display: none; white-space: nowrap; }

  .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .filtros input, .filtros select { padding: 9px 12px; border: 1px solid var(--linea); border-radius: 10px; background: #fff; }
  .filtros input { flex: 1; min-width: 200px; }
  .filtros .der { margin-left: auto; display: flex; gap: 8px; }
  .tabla { background: #fff; border-radius: var(--radio); overflow-x: auto; box-shadow: 0 1px 0 var(--linea); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-size: 12px; color: var(--gris); font-weight: 600; padding: 11px 12px; border-bottom: 1px solid var(--linea); white-space: nowrap; background: #FCFAF6; position: sticky; top: 0; }
  td { padding: 10px 12px; border-bottom: 1px solid #F1EADF; white-space: nowrap; }
  tr.click { cursor: pointer; } tr.click:hover td { background: #FFF9EE; }
  tr.nuevo td { background: #FFF6D6; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pag { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; font-size: 13px; color: var(--gris); }
  .pag button { border: 1px solid var(--linea); background: #fff; border-radius: 8px; padding: 5px 12px; }

  .modal { position: fixed; inset: 0; background: rgba(43, 27, 23, .5); display: none; align-items: center; justify-content: center; z-index: 80; padding: 16px; }
  .modal.on { display: flex; }
  .modal .caja { background: #fff; border-radius: 18px; max-width: 860px; width: 100%; max-height: 92vh; overflow-y: auto; display: grid; grid-template-columns: 300px 1fr; }
  .modal .foto { background: #6d6259; padding: 18px; display: flex; align-items: flex-start; justify-content: center; border-radius: 18px 0 0 18px; }
  .modal .foto canvas, .modal .foto img { width: 100%; border-radius: 6px; }
  .modal .info { padding: 22px 24px; }
  .modal .info h2 { font-size: 22px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .modal .cerrar { border: 0; background: var(--crema); border-radius: 50%; width: 32px; height: 32px; font-size: 16px; }
  .datos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; font-size: 13.5px; margin: 10px 0 16px; }
  .datos span { display: block; font-size: 11.5px; color: var(--gris); }
  .checks { list-style: none; padding: 0; margin: 0 0 14px; }
  .checks li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 7px 0; border-top: 1px solid var(--linea); font-size: 13.5px; }
  .checks .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }
  .ic.ok { background: var(--verde); } .ic.rechazo { background: var(--rojo); } .ic.dup { background: var(--morado); } .ic.revision { background: var(--naranja); }
  .checks small { display: block; color: var(--gris); }
  .decidir { background: var(--crema); border-radius: 12px; padding: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .decidir select { padding: 8px; border-radius: 8px; border: 1px solid var(--linea); flex: 1; min-width: 180px; }
  .btn.verde { background: var(--verde); } .btn.verde:hover { background: #157048; }
  @media (max-width: 760px) { .modal .caja { grid-template-columns: 1fr; } .modal .foto { border-radius: 18px 18px 0 0; max-height: 300px; overflow: hidden; } }
  .transcript { max-height: 360px; overflow-y: auto; background: #EFE7DD; border-radius: 10px; padding: 10px; }
  .transcript div { max-width: 80%; margin-bottom: 6px; padding: 6px 9px; border-radius: 8px; font-size: 13px; white-space: pre-line; background: #fff; }
  .transcript div.yo { background: #D9FDD3; margin-left: auto; }
  .transcript small { display: block; color: #8696A0; font-size: 10.5px; }

  .faq-item { background: #fff; border-radius: var(--radio); padding: 16px 18px; margin-bottom: 10px; box-shadow: 0 1px 0 var(--linea); }
  .faq-item input, .faq-item textarea { width: 100%; border: 1px solid var(--linea); border-radius: 8px; padding: 9px 11px; }
  .faq-item input { font-weight: 700; margin-bottom: 8px; }
  .faq-item textarea { min-height: 86px; resize: vertical; }
  .faq-item .pie { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 12px; color: var(--gris); gap: 10px; flex-wrap: wrap; }
  .guardado { color: var(--verde); font-weight: 600; }
  .regla { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: start; padding: 14px 0; border-top: 1px solid var(--linea); }
  .regla:first-of-type { border-top: 0; }
  .regla .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-weight: 700; }
  .regla p { margin: 2px 0 0; font-size: 13.5px; color: var(--gris); }
  .nota { background: #FFF6D6; border-radius: 12px; padding: 14px 16px; font-size: 13.5px; margin-top: 14px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--tinta); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; transition: transform .25s; z-index: 99; }
  .toast.on { transform: translateX(-50%); }
  .oculto { display: none !important; }
</style>
</head>
<body>
<div class="demo-bar">
  <span class="tag">DEMO</span><span class="txt">Hecha para <b>Casa Europa</b> por</span><img class="free" src="free-logo.png" alt="Free Marketing &amp; Publicidad">
  <nav><a href="index.html">1 · Landing</a><a href="whatsapp.html">2 · Chatbot WhatsApp</a><a class="on" href="panel.html">3 · Panel</a></nav>
</div>
<div class="app">
  <aside>
    <div class="marca"><img class="logo-ce" src="logo.png" alt="Casa Europa" style="width:120px"></div>
    <button data-v="resumen" class="on">📊 Resumen</button>
    <button data-v="comprobantes">🧾 Comprobantes <span class="n" id="nPend"></span></button>
    <button data-v="participantes">👥 Participantes</button>
    <button data-v="conversaciones">💬 Conversaciones</button>
    <button data-v="respuestas">✏️ Respuestas del bot</button>
    <button data-v="reglas">🛡️ Reglas de validación</button>
    <button data-v="usuarios" id="tabUsuarios">🔐 Usuarios y permisos</button>
    <div class="rol">Ver el panel como:
      <select id="rol"></select>
      <p id="rolDesc"></p>
      <button class="btn chico sec" id="reset" style="margin-top:8px">Restablecer datos de ejemplo</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div class="modal" id="modal"><div class="caja" id="modalCaja"></div></div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script src="shared.js"></script>
<script>
const $ = id => document.getElementById(id);
const E = CE.esc;
let db = CE.cargar();
let vista = 'resumen', rol = 'admin', periodo = 28;
const filtro = { q: '', estado: '', cadena: '', pagina: 0 };
const filtroP = { q: '', pagina: 0 };
const vistos = new Set(db.comprobantes.map(c => c.id));
const COLOR = { aprobado: '#1E8E5A', pendiente: '#D9822B', rechazado: '#B3261E', duplicado: '#7A4FB5' };

try { const r = localStorage.getItem('ce-demo-rol'); if (r) rol = r; } catch (e) {}
$('rol').innerHTML = CE.ROLES.map(r => `<option value="${r.id}">${r.nombre}</option>`).join('');
$('rol').value = rol;
$('rol').onchange = () => { rol = $('rol').value; try { localStorage.setItem('ce-demo-rol', rol); } catch (e) {} aplicarRol(); pintar(); };
function aplicarRol() {
  $('rolDesc').textContent = CE.ROLES.find(r => r.id === rol).puede;
  $('tabUsuarios').classList.toggle('oculto', rol !== 'admin');
  if (rol !== 'admin' && vista === 'usuarios') vista = 'resumen';
}
const dniVer = d => rol === 'cliente' ? '••••' + String(d).slice(-4) : d;
const celVer = c => rol === 'cliente' ? '9•• ••• ' + String(c).slice(-3) : c;
const puedeValidar = () => rol !== 'cliente';

document.querySelectorAll('aside button[data-v]').forEach(b => b.onclick = () => { vista = b.dataset.v; pintar(); });
$('reset').onclick = () => { if (confirm('¿Volver a los datos de ejemplo? Se borran los registros hechos en el simulador.')) { db = CE.reiniciar(); pintar(); toast('Datos de ejemplo restablecidos'); } };
window.addEventListener('storage', e => { if (e.key === CE.KEY) { db = CE.cargar(); pintar(true); } });

function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2200); }
function cab(t, sub, extra) { return `<div class="cab"><div><h1>${t}</h1><p>${sub}</p></div>${extra || ''}</div>`; }

function pintar(silencioso) {
  document.querySelectorAll('aside button[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === vista));
  const pend = db.comprobantes.filter(c => c.estado === 'pendiente').length;
  $('nPend').textContent = pend || ''; $('nPend').style.display = pend ? '' : 'none';
  if (silencioso && vista === 'respuestas') return; // no pisar lo que se está editando
  ({ resumen, comprobantes, participantes, conversaciones, respuestas, reglas, usuarios })[vista]();
}

// ---------------- Resumen ----------------
function enPeriodo(t) { return !periodo || t >= Date.now() - periodo * CE.DIA; }
function resumen() {
  const comp = db.comprobantes.filter(c => enPeriodo(c.recibido));
  const conv = db.conversaciones.filter(c => enPeriodo(c.inicio));
  const part = db.participantes.filter(p => enPeriodo(p.creado));
  const cuenta = e => comp.filter(c => c.estado === e).length;
  const aprob = comp.filter(c => c.estado === 'aprobado');
  const conComp = new Set(comp.map(c => c.dni)).size;
  const personas = new Set(conv.map(c => c.celular)).size;
  const importe = aprob.reduce((s, c) => s + c.importe, 0);
  const opciones = aprob.reduce((s, c) => s + c.opciones, 0);
  const plantillas = conv.reduce((s, c) => s + (c.plantillas || 0), 0);
  const msjs = conv.reduce((s, c) => s + c.mensajes, 0);
  const segP = `<div class="seg">${[[7, '7 días'], [14, '14 días'], [28, '28 días'], [0, 'Todo']].map(([v, t]) => `<button data-p="${v}" class="${periodo === v ? 'on' : ''}">${t}</button>`).join('')}</div>`;
  $('main').innerHTML = cab('Resumen de la campaña', `Actualizado ${CE.fmtFechaHora(Date.now())} · se refresca solo cuando entra un registro`, segP) +
  `<div class="kpis">
    <div class="kpi"><span>Personas que escribieron</span><b>${personas.toLocaleString('es-PE')}</b><small>${conv.length.toLocaleString('es-PE')} conversaciones</small></div>
    <div class="kpi"><span>Participantes registrados</span><b>${part.length.toLocaleString('es-PE')}</b><small>${conComp.toLocaleString('es-PE')} enviaron comprobante</small></div>
    <div class="kpi"><span>Comprobantes recibidos</span><b>${comp.length.toLocaleString('es-PE')}</b><small>${(comp.length / Math.max(1, conComp)).toFixed(1)} por participante</small></div>
    <div class="kpi verde"><span>Aprobados</span><b>${cuenta('aprobado').toLocaleString('es-PE')}</b><small>${pct(cuenta('aprobado'), comp.length)} del total</small></div>
    <div class="kpi naranja"><span>Pendientes de revisión</span><b>${cuenta('pendiente')}</b><small>los revisa una persona</small></div>
    <div class="kpi rojo"><span>Rechazados</span><b>${cuenta('rechazado')}</b><small>${pct(cuenta('rechazado'), comp.length)} del total</small></div>
    <div class="kpi morado"><span>Duplicados detectados</span><b>${cuenta('duplicado')}</b><small>no sumaron opciones</small></div>
    <div class="kpi"><span>Importe registrado (aprobado)</span><b style="font-size:24px">${CE.soles(importe)}</b><small>${opciones.toLocaleString('es-PE')} opciones generadas</small></div>
    <div class="kpi"><span>Costo WhatsApp estimado</span><b style="font-size:24px">US$ ${(plantillas * 0.02).toFixed(2)}</b><small>${msjs.toLocaleString('es-PE')} mensajes · ${plantillas} avisos pagados</small></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>Comprobantes por día <small>pasa el cursor por las barras</small></h3>
      <div class="leyenda">${Object.keys(COLOR).map(k => `<span><i style="background:${COLOR[k]}"></i>${CE.ETIQ[k]}</span>`).join('')}</div>
      <div id="graf"></div></div>
    <div class="card embudo"><h3>Embudo de participación</h3>${barras([
      ['Personas que escribieron', personas], ['Se registraron', part.length], ['Enviaron comprobante', conComp], ['Con al menos 1 aprobado', new Set(aprob.map(c => c.dni)).size]], personas, '')}
      <h3 style="margin-top:18px">Canal de llegada</h3>${barras(contar(part, p => p.canal), part.length, '')}</div>
  </div>
  <div class="grid3">
    <div class="card"><h3>Productos más registrados <small>unidades</small></h3>${barras(productosTop(aprob), null, '')}</div>
    <div class="card"><h3>Comprobantes por cadena</h3>${barras(contar(comp, c => c.cadena), comp.length, '')}</div>
    <div class="card"><h3>Motivos de rechazo y duplicados</h3>${barras(contar(comp.filter(c => c.estado === 'rechazado' || c.estado === 'duplicado'), c => c.motivo), null, '')}</div>
  </div>`;
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { periodo = +b.dataset.p; pintar(); });
  grafDias(comp);
}
const pct = (a, b) => b ? Math.round(a / b * 100) + ' %' : '0 %';
function contar(arr, fn) { const m = {}; arr.forEach(x => { const k = fn(x) || '—'; m[k] = (m[k] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); }
function productosTop(aprob) { const m = {}; aprob.forEach(c => c.items.filter(i => i.participa).forEach(i => m[i.nombre] = (m[i.nombre] || 0) + i.cant)); return Object.entries(m).sort((a, b) => b[1] - a[1]); }
function barras(pares, max, suf) {
  max = max || Math.max(1, ...pares.map(p => p[1]));
  return pares.map(([k, v]) => `<div class="hbar"><span>${E(k)}</span><div class="t"><i style="width:${Math.max(1, v / max * 100)}%"></i></div><b>${v.toLocaleString('es-PE')}${suf}</b></div>`).join('') || '<p class="muted">Sin datos en este periodo</p>';
}
function grafDias(comp) {
  const n = periodo || 35, W = 640, H = 220, pad = { l: 30, r: 6, t: 8, b: 24 };
  const dias = []; const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  for (let i = n - 1; i >= 0; i--) dias.push({ t: hoy.getTime() - i * CE.DIA, aprobado: 0, pendiente: 0, rechazado: 0, duplicado: 0 });
  comp.forEach(c => { const d = new Date(c.recibido); d.setHours(0, 0, 0, 0); const x = dias.find(z => z.t === d.getTime()); if (x) x[c.estado]++; });
  const max = Math.max(5, ...dias.map(d => d.aprobado + d.pendiente + d.rechazado + d.duplicado));
  const bw = (W - pad.l - pad.r) / n, y = v => (H - pad.b) - v / max * (H - pad.t - pad.b);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Comprobantes por día">`;
  [0, .5, 1].forEach(f => { const v = Math.round(max * f); s += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="#EFE6D8"/><text x="${pad.l - 6}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="#8a7d74">${v}</text>`; });
  dias.forEach((d, i) => {
    let acc = 0; const x = pad.l + i * bw + bw * 0.15, w = bw * 0.7;
    const tot = d.aprobado + d.pendiente + d.rechazado + d.duplicado;
    ['aprobado', 'pendiente', 'rechazado', 'duplicado'].forEach(k => { if (!d[k]) return; s += `<rect x="${x}" y="${y(acc + d[k])}" width="${w}" height="${y(acc) - y(acc + d[k])}" fill="${COLOR[k]}" rx="1.5"/>`; acc += d[k]; });
    s += `<rect x="${pad.l + i * bw}" y="${pad.t}" width="${bw}" height="${H - pad.t - pad.b}" fill="transparent" data-tip="${CE.fmtFecha(d.t)} · ${tot} comprobantes · ${d.aprobado} aprob. · ${d.pendiente} pend. · ${d.rechazado} rech. · ${d.duplicado} dup."/>`;
    if (i % Math.ceil(n / 8) === 0 || i === n - 1) s += `<text x="${x + w / 2}" y="${H - 6}" font-size="10" text-anchor="middle" fill="#8a7d74">${CE.fmtFecha(d.t)}</text>`;
  });
  $('graf').innerHTML = s + '</svg>';
  $('graf').querySelectorAll('[data-tip]').forEach(r => {
    r.onmousemove = e => { const t = $('tip'); t.textContent = r.dataset.tip; t.style.display = 'block'; t.style.left = Math.min(e.clientX + 12, innerWidth - t.offsetWidth - 8) + 'px'; t.style.top = e.clientY - 34 + 'px'; };
    r.onmouseleave = () => $('tip').style.display = 'none';
  });
}

// ---------------- Comprobantes ----------------
function filtrados() {
  const q = CE.norm(filtro.q);
  return db.comprobantes.filter(c => (!filtro.estado || c.estado === filtro.estado) && (!filtro.cadena || c.cadena === filtro.cadena) &&
    (!q || CE.norm([c.nombre, c.dni, c.serie + '-' + c.numero, c.numero, c.tienda].join(' ')).includes(q)));
}
function comprobantes() {
  const lista = filtrados(), por = 40, pag = Math.min(filtro.pagina, Math.max(0, Math.ceil(lista.length / por) - 1));
  const cadenas = [...new Set(db.comprobantes.map(c => c.cadena))].sort();
  $('main').innerHTML = cab('Comprobantes', 'Haz clic en una fila para ver la foto, la lectura y las reglas aplicadas' + (puedeValidar() ? ', y aprobar o rechazar los pendientes.' : '.')) +
  `<div class="filtros">
    <input id="q" placeholder="Buscar por nombre, DNI, número de comprobante o tienda" value="${E(filtro.q)}">
    <select id="fe"><option value="">Todos los estados</option>${Object.keys(CE.ETIQ).map(k => `<option value="${k}" ${filtro.estado === k ? 'selected' : ''}>${CE.ETIQ[k]}</option>`).join('')}</select>
    <select id="fc"><option value="">Todas las cadenas</option>${cadenas.map(k => `<option ${filtro.cadena === k ? 'selected' : ''}>${E(k)}</option>`).join('')}</select>
    <div class="der"><button class="btn chico" id="xls">⬇ Descargar Excel</button></div>
  </div>
  <div class="tabla"><table><thead><tr><th>Recibido</th><th>Participante</th><th>DNI</th><th>Cadena · tienda</th><th>Comprobante</th><th class="num">Importe</th><th class="num">Opciones</th><th>Estado</th><th>Motivo</th></tr></thead><tbody>
  ${lista.slice(pag * por, pag * por + por).map(c => `<tr class="click ${vistos.has(c.id) ? '' : 'nuevo'}" data-id="${c.id}"><td>${CE.fmtFechaHora(c.recibido)}</td><td>${E(c.nombre)}</td><td>${dniVer(c.dni)}</td><td>${E(c.cadena)}${c.tienda && c.tienda !== '—' ? ' · ' + E(c.tienda) : ''}</td><td>${E(c.serie + '-' + c.numero)}</td><td class="num">${CE.soles(c.importe)}</td><td class="num">${c.opciones || ''}</td><td><span class="chip e-${c.estado}">${CE.ETIQ[c.estado]}</span></td><td class="muted">${E(c.motivo || '')}</td></tr>`).join('') || '<tr><td colspan="9" class="muted">Sin resultados</td></tr>'}
  </tbody></table></div>
  <div class="pag"><span>${lista.length.toLocaleString('es-PE')} comprobantes · página ${pag + 1} de ${Math.max(1, Math.ceil(lista.length / por))}</span><span><button id="ant" ${pag ? '' : 'disabled'}>← Anterior</button> <button id="sig" ${(pag + 1) * por < lista.length ? '' : 'disabled'}>Siguiente →</button></span></div>`;
  const re = () => { filtro.pagina = 0; comprobantes(); const i = $('q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); };
  $('q').oninput = e => { filtro.q = e.target.value; re(); };
  $('fe').onchange = e => { filtro.estado = e.target.value; re(); };
  $('fc').onchange = e => { filtro.cadena = e.target.value; re(); };
  $('ant').onclick = () => { filtro.pagina = pag - 1; comprobantes(); };
  $('sig').onclick = () => { filtro.pagina = pag + 1; comprobantes(); };
  $('xls').onclick = () => descargar('comprobantes', ['Recibido', 'Participante', 'DNI', 'Celular', 'Cadena', 'Tienda', 'Tipo', 'RUC emisor', 'Serie', 'Número', 'Fecha compra', 'Importe', 'Productos participantes', 'Opciones', 'Estado', 'Motivo', 'Validado por'],
    lista.map(c => [new Date(c.recibido).toLocaleString('es-PE'), c.nombre, dniVer(c.dni), celVer(c.celular), c.cadena, c.tienda, c.tipo, c.ruc, c.serie, c.numero, c.fecha, c.importe, c.items.filter(i => i.participa).map(i => i.cant + 'x ' + i.nombre).join(' | '), c.opciones, CE.ETIQ[c.estado], c.motivo, c.validadoPor || '']));
  document.querySelectorAll('tr[data-id]').forEach(r => r.onclick = () => abrirComp(r.dataset.id));
}
function abrirComp(id) {
  const c = db.comprobantes.find(x => x.id === id); if (!c) return;
  vistos.add(id);
  const iconos = { ok: '✓', rechazo: '✕', dup: '⧉', revision: '!' };
  const prev = c.estado === 'duplicado' ? db.comprobantes.find(p => p !== c && p.ruc === c.ruc && p.serie === c.serie && p.numero === c.numero && p.estado !== 'duplicado') : null;
  $('modalCaja').innerHTML = `<div class="foto" id="foto"></div><div class="info">
    <h2><span>${E(c.tipo + ' ' + c.serie + '-' + c.numero)}</span><button class="cerrar" id="cerrar">✕</button></h2>
    <span class="chip e-${c.estado}">${CE.ETIQ[c.estado]}</span> ${c.motivo ? `<span class="muted" style="font-size:13px">· ${E(c.motivo)}</span>` : ''}
    <div class="datos">
      <div><span>Participante</span>${E(c.nombre)}</div><div><span>DNI · celular</span>${dniVer(c.dni)} · ${celVer(c.celular)}</div>
      <div><span>Emisor</span>${E(c.razon)}</div><div><span>RUC</span>${E(c.ruc)}</div>
      <div><span>Cadena · tienda</span>${E(c.cadena)} · ${E(c.tienda)}</div><div><span>Fecha de compra</span>${E(c.fecha)}</div>
      <div><span>Importe</span>${CE.soles(c.importe)}</div><div><span>Recibido</span>${CE.fmtFechaHora(c.recibido)}</div>
      <div style="grid-column:1/-1"><span>Productos participantes</span>${E(c.items.filter(i => i.participa).map(i => i.cant + '× ' + i.nombre).join(', ') || '—')}</div>
      ${prev ? `<div style="grid-column:1/-1"><span>Registrado antes por</span>${E(prev.nombre)} · ${CE.fmtFechaHora(prev.recibido)} (${prev.id})</div>` : ''}
      ${c.validadoPor ? `<div style="grid-column:1/-1"><span>Revisión manual</span>${E(c.validadoPor)} · ${CE.fmtFechaHora(c.validadoEn)}</div>` : ''}
    </div>
    <h3 style="font-family:var(--texto);font-size:14px">Reglas aplicadas automáticamente</h3>
    <ul class="checks">${(c.checks || []).map(k => `<li><span class="ic ${k.nivel}">${iconos[k.nivel]}</span><div>${E(k.regla)}<small>${E(k.detalle)}</small></div></li>`).join('')}</ul>
    ${c.estado === 'pendiente' && puedeValidar() ? `<div class="decidir"><button class="btn chico verde" id="aprobar">✓ Aprobar</button>
      <select id="motivo"><option>Comprobante alterado</option><option>Datos no coinciden con la foto</option><option>Imagen ilegible</option><option>Sin productos participantes</option><option>Comprobante anulado en SUNAT</option></select>
      <button class="btn chico" id="rechazar">✕ Rechazar</button></div>
      <p class="muted" style="font-size:12px;margin:8px 0 0">Al decidir, el participante recibe el aviso por WhatsApp (pruébalo con el simulador abierto en otra pestaña).</p>` : ''}
  </div>`;
  const f = $('foto');
  if (c.imagen && c.imagen !== 'muestra') { const im = new Image(); im.src = c.imagen; f.appendChild(im); }
  else { const cv = document.createElement('canvas'); CE.dibujarBoleta(cv, c, { borroso: c.borroso || c.confianza < 0.8 }); f.appendChild(cv); }
  $('modal').classList.add('on');
  $('cerrar').onclick = cerrarModal;
  if ($('aprobar')) {
    $('aprobar').onclick = () => decidir(c, 'aprobado', 'Aprobado en revisión manual');
    $('rechazar').onclick = () => decidir(c, 'rechazado', $('motivo').value + ' (revisión manual)');
  }
}
function decidir(c, estado, motivo) {
  db = CE.cargar(); const x = db.comprobantes.find(z => z.id === c.id);
  x.estado = estado; x.motivo = motivo; x.opciones = estado === 'aprobado' ? CE.opcionesDe(x) : 0;
  x.validadoPor = rol === 'admin' ? 'Administrador Free' : 'Validador Free'; x.validadoEn = Date.now();
  CE.guardar(db); cerrarModal(); pintar(); toast(estado === 'aprobado' ? 'Comprobante aprobado · se avisó al participante' : 'Comprobante rechazado · se avisó al participante');
}
function cerrarModal() { $('modal').classList.remove('on'); }
$('modal').onclick = e => { if (e.target.id === 'modal') cerrarModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModal(); });

// ---------------- Participantes ----------------
function participantes() {
  const q = CE.norm(filtroP.q);
  const porDni = {}; db.comprobantes.forEach(c => { const p = porDni[c.dni] || (porDni[c.dni] = { n: 0, op: 0, imp: 0 }); p.n++; if (c.estado === 'aprobado') { p.op += c.opciones; p.imp += c.importe; } });
  const lista = db.participantes.filter(p => !q || CE.norm([p.nombre, p.dni, p.distrito, p.celular].join(' ')).includes(q)).sort((a, b) => b.creado - a.creado);
  const por = 40, pag = Math.min(filtroP.pagina, Math.max(0, Math.ceil(lista.length / por) - 1));
  $('main').innerHTML = cab('Participantes', 'Una persona por DNI. Las opciones salen solo de comprobantes aprobados.') +
  `<div class="filtros"><input id="q" placeholder="Buscar por nombre, DNI, celular o distrito" value="${E(filtroP.q)}"><div class="der"><button class="btn chico" id="xls">⬇ Descargar Excel</button></div></div>
  <div class="tabla"><table><thead><tr><th>Registrado</th><th>Nombre</th><th>DNI</th><th>Celular</th><th>Distrito</th><th>Canal</th><th class="num">Comprobantes</th><th class="num">Importe aprobado</th><th class="num">Opciones</th></tr></thead><tbody>
  ${lista.slice(pag * por, pag * por + por).map(p => { const s = porDni[p.dni] || { n: 0, op: 0, imp: 0 }; return `<tr><td>${CE.fmtFechaHora(p.creado)}</td><td>${E(p.nombre)}</td><td>${dniVer(p.dni)}</td><td>${celVer(p.celular)}</td><td>${E(p.distrito)}</td><td>${E(p.canal)}</td><td class="num">${s.n}</td><td class="num">${CE.soles(s.imp)}</td><td class="num"><b>${s.op}</b></td></tr>`; }).join('')}
  </tbody></table></div>
  <div class="pag"><span>${lista.length.toLocaleString('es-PE')} participantes · página ${pag + 1} de ${Math.max(1, Math.ceil(lista.length / por))}</span><span><button id="ant" ${pag ? '' : 'disabled'}>← Anterior</button> <button id="sig" ${(pag + 1) * por < lista.length ? '' : 'disabled'}>Siguiente →</button></span></div>`;
  $('q').oninput = e => { filtroP.q = e.target.value; filtroP.pagina = 0; participantes(); const i = $('q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); };
  $('ant').onclick = () => { filtroP.pagina = pag - 1; participantes(); };
  $('sig').onclick = () => { filtroP.pagina = pag + 1; participantes(); };
  $('xls').onclick = () => descargar('participantes', ['Registrado', 'Nombre', 'DNI', 'Celular', 'Distrito', 'Canal', 'Comprobantes', 'Importe aprobado', 'Opciones'],
    lista.map(p => { const s = porDni[p.dni] || { n: 0, op: 0, imp: 0 }; return [new Date(p.creado).toLocaleString('es-PE'), p.nombre, dniVer(p.dni), celVer(p.celular), p.distrito, p.canal, s.n, s.imp.toFixed(2), s.op]; }));
}

// ---------------- Conversaciones ----------------
function conversaciones() {
  const lista = db.conversaciones.slice(0, 150);
  const porEstado = contar(db.conversaciones, c => c.estado);
  $('main').innerHTML = cab('Conversaciones', 'Cada chat de WhatsApp con el bot. Las que hiciste en el simulador se pueden abrir para leerlas.') +
  `<div class="kpis">${porEstado.map(([k, v]) => `<div class="kpi"><span>${E(k)}</span><b>${v}</b></div>`).join('')}
   <div class="kpi"><span>Mensajes en total</span><b>${db.conversaciones.reduce((s, c) => s + c.mensajes, 0).toLocaleString('es-PE')}</b></div></div>
  <div class="tabla"><table><thead><tr><th>Inicio</th><th>Celular</th><th>Nombre</th><th>Tema</th><th class="num">Mensajes</th><th class="num">Avisos pagados</th><th>Estado</th></tr></thead><tbody>
  ${lista.map(c => `<tr class="${c.log ? 'click' : ''} ${c.live ? 'nuevo' : ''}" data-id="${c.id}"><td>${CE.fmtFechaHora(c.inicio)}</td><td>${celVer(c.celular)}</td><td>${E(c.nombre || 'Sin registrar')}</td><td>${E(c.tema)}</td><td class="num">${c.mensajes}</td><td class="num">${c.plantillas || 0}</td><td>${E(c.estado)}${c.log ? ' · <b style="color:var(--rojo)">ver chat</b>' : ''}</td></tr>`).join('')}
  </tbody></table></div><p class="muted" style="font-size:12px">Se muestran las 150 más recientes.</p>`;
  document.querySelectorAll('tr.click').forEach(r => r.onclick = () => {
    const c = db.conversaciones.find(x => x.id === r.dataset.id);
    $('modalCaja').innerHTML = `<div class="info" style="grid-column:1/-1"><h2><span>Chat con ${E(c.nombre || celVer(c.celular))}</span><button class="cerrar" id="cerrar">✕</button></h2>
      <div class="transcript">${c.log.map(m => `<div class="${m.de}">${m.humano ? '<b>' + E(m.humano) + '</b><br>' : ''}${E((m.texto || '').replace(/\*/g, ''))}<small>${CE.fmtHora(m.t)}</small></div>`).join('')}</div></div>`;
    $('modal').classList.add('on'); $('cerrar').onclick = cerrarModal;
  });
}

// ---------------- Respuestas del bot ----------------
function respuestas() {
  const ro = rol === 'cliente';
  $('main').innerHTML = cab('Respuestas del bot', ro ? 'Solo lectura para este rol.' : 'Edita y guarda: el cambio se ve al instante en el chatbot y en las preguntas de la landing.', ro ? '' : '<button class="btn chico" id="nueva">+ Nueva pregunta</button>') +
    db.faq.map((f, i) => `<div class="faq-item" data-i="${i}"><input value="${E(f.q)}" ${ro ? 'disabled' : ''}><textarea ${ro ? 'disabled' : ''}>${E(f.a)}</textarea>
      <div class="pie"><span>Palabras que la activan: ${E((f.k || []).join(', ') || '—')}</span>${ro ? '' : `<span><span class="guardado" hidden>Guardado ✓</span> <button class="btn chico sec" data-g="${i}">Guardar</button></span>`}</div></div>`).join('') +
    `<div class="nota"><b>¿Reglas o inteligencia artificial?</b> Proponemos una combinación: los flujos importantes (registro, envío de boleta, estados) siguen reglas fijas para que siempre respondan igual. La IA solo entiende preguntas escritas con otras palabras y las lleva a la respuesta aprobada de esta lista; no inventa respuestas.</div>`;
  document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
    const i = +b.dataset.g, box = b.closest('.faq-item');
    db = CE.cargar(); db.faq[i].q = box.querySelector('input').value.trim(); db.faq[i].a = box.querySelector('textarea').value.trim(); CE.guardar(db);
    const g = box.querySelector('.guardado'); g.hidden = false; setTimeout(() => g.hidden = true, 1800);
  });
  if ($('nueva')) $('nueva').onclick = () => { db = CE.cargar(); db.faq.push({ id: 'f' + Date.now(), q: 'Nueva pregunta', a: 'Respuesta', k: [] }); CE.guardar(db); respuestas(); window.scrollTo(0, 1e6); };
}

// ---------------- Reglas ----------------
function reglas() {
  const R = [
    ['ok', '📷', 'Foto legible', 'La IA lee la imagen y da un nivel de confianza. Si es menor a 80 %, se pide otra foto.', 'Automático'],
    ['ok', '🧾', 'Datos completos', 'Debe tener RUC del emisor, serie y número, fecha e importe.', 'Automático'],
    ['ok', '🏬', 'Cadena participante', 'El RUC del emisor debe ser de Wong/Metro, Plaza Vea, Tottus o Makro.', 'Automático'],
    ['ok', '📅', 'Fecha dentro de la promoción', 'La fecha de compra debe estar dentro de la vigencia.', 'Automático'],
    ['ok', '🥓', 'Productos participantes', 'Al menos un producto de la marca en el detalle.', 'Automático'],
    ['dup', '⧉', 'Anti-duplicados', 'Cada combinación RUC + serie + número vale una sola vez, sin importar quién la envíe. También se compara la huella de la imagen para detectar la misma foto reenviada.', 'Automático'],
    ['revision', '👤', `Máximo ${CE.CAMPANA.max_por_dia} comprobantes por DNI al día`, 'Si se supera, pasa a revisión manual.', 'A revisión'],
    ['revision', '💰', `Importe mayor a S/ ${CE.CAMPANA.monto_revision}`, 'Compras inusualmente grandes las revisa una persona.', 'A revisión'],
    ['revision', '🔍', 'Señales de edición', 'Tipografía irregular, totales que no cuadran o lectura dudosa: pasa a revisión manual.', 'A revisión'],
  ];
  const bg = { ok: 'var(--verde)', dup: 'var(--morado)', revision: 'var(--naranja)' };
  $('main').innerHTML = cab('Reglas de validación', `Cada S/ ${CE.CAMPANA.soles_por_opcion} en productos participantes = 1 opción. Los valores se ajustan con Casa Europa.`) +
  `<div class="card">${R.map(([t, ic, h, p, et]) => `<div class="regla"><div class="ic" style="background:${bg[t]}">${ic}</div><div><b>${h}</b><p>${p}</p></div><span class="chip ${t === 'revision' ? 'e-pendiente' : t === 'dup' ? 'e-duplicado' : 'e-aprobado'}">${et}</span></div>`).join('')}</div>
  <div class="nota"><b>Importante:</b> leer una foto no prueba por sí solo que el comprobante sea auténtico. Por eso combinamos reglas automáticas, revisión manual de los casos dudosos y, de forma opcional, la consulta de validez del comprobante en SUNAT antes de los sorteos. Los RUC de las cadenas de esta demo son referenciales y se confirman con el cliente.</div>`;
}

// ---------------- Excel ----------------
function descargar(nombre, cab, filas) {
  const celda = v => { const s = v == null ? '' : String(v); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = '﻿' + [cab, ...filas].map(f => f.map(celda).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `promo-casa-europa-${nombre}-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
  toast(`Descargado: ${filas.length} filas`);
}
